<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1113">
<title>Temple Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">TEMPLE WATCH<small>Outpost Aurek-7 · Sith frontier · ~3,600 BBY</small></div>
    <div class="stats">
      <span>Turn <b id="sTurn">1/8</b></span>
      <span>Relay <b id="sCons">20</b></span>
      <span>Next wave <b id="sWave">T3</b></span>
      <span>Intel <b id="sIntel">0</b></span>
      <span class="dk">Darkness <b id="sDark">0</b></span>
    </div>
    <div class="endrow"><button id="syncBtn" type="button">Sync: <span id="sSync">off</span></button><button id="infoBtn" type="button">Info: off</button></div>
  </header>
  <main class="layout">
    <div><div id="board" class="board" role="grid" aria-label="Battle map"></div></div>
    <aside class="side">
      <div class="panel"><div id="roster" class="roster"></div></div>
      <div class="panel" id="card"></div>
      <div class="panel">
        <div id="acts" class="acts"></div>
        <div id="hint" class="hint"></div>
        <div class="endrow"><button id="endBtn" type="button" class="primary">End turn</button></div>
      </div>
      <div class="panel"><div id="log" class="log" aria-live="polite"></div></div>
    </aside>
  </main>
  <div id="modal" class="modal" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/rules.js"></script>
<script src="js/abilities.js"></script>
<script src="js/turns.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/screens.js"></script>
</body>
</html>
