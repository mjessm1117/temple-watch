<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1113">
<title>Temple Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/app-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">TEMPLE WATCH<small id="where">Jedi Temple · ~3,660 BBY</small></div>
    <div class="stats">
      <span>Turn <b id="sTurn">–</b></span>
      <span><span id="sObjL">Objective</span> <b id="sObj">–</b></span>
      <span id="sWaveW">Next wave <b id="sWave">–</b></span>
      <span id="sThrW" class="thr" hidden>Threat <b id="sThr">0</b></span>
      <span>Intel <b id="sIntel">0</b></span>
      <span class="dk">Darkness <b id="sDark">0</b></span>
    </div>
    <div class="endrow"><button id="viewBtn" type="button" hidden>View: 3D</button><button id="syncBtn" type="button">Sync: <span id="sSync">off</span></button><button id="infoBtn" type="button">Info: off</button></div>
  </header>
  <div id="banner" class="banner" aria-live="polite"></div>
  <main class="layout">
    <div class="bwrap"><div id="board" class="board" role="grid" aria-label="Battle map"></div><svg id="over" class="over" viewBox="0 0 10 12" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <aside class="side">
      <div class="panel"><div id="roster" class="roster"></div></div>
      <div class="panel" id="card" aria-live="polite"></div>
      <div class="panel">
        <div id="acts" class="acts"></div>
        <div id="odds"></div>
        <div id="hint" class="hint"></div>
        <div class="endrow"><button id="endBtn" type="button" class="primary">End turn</button></div>
      </div>
      <div class="panel"><div id="log" class="log" aria-live="polite"></div></div>
    </aside>
  </main>
  <div id="modal" class="modal" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/data-campaign.js"></script>
<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/rules.js"></script>
<script src="js/abilities.js"></script>
<script src="js/turns.js"></script>
<script src="js/ai.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/campaign.js"></script>
<script src="js/temple-data.js"></script>
<script src="js/temple-kits.js"></script>
<script src="js/temple.js"></script>
<script src="js/temple-ui.js"></script>
<script src="js/base.js"></script>
<script src="js/screens.js"></script>
<script type="module" src="js/view3d/main.js"></script>
</body>
</html>
